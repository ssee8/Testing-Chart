name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and publish image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --tag ghcr.io/ssee8/testing-chart:latest \
            --tag "ghcr.io/ssee8/testing-chart:$GITHUB_SHA" \
            .
          docker push ghcr.io/ssee8/testing-chart:latest
          docker push "ghcr.io/ssee8/testing-chart:$GITHUB_SHA"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "SERVER_SSH_KEY is required"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "SERVER_KNOWN_HOSTS is required"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_DEPLOY_PATH: ${{ vars.SERVER_DEPLOY_PATH }}
          SERVER_SSH_PORT: ${{ vars.SERVER_SSH_PORT || '22' }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          test -n "$SERVER_HOST" || { echo "SERVER_HOST is required"; exit 1; }
          test -n "$SERVER_USER" || { echo "SERVER_USER is required"; exit 1; }
          test -n "$SERVER_DEPLOY_PATH" || { echo "SERVER_DEPLOY_PATH is required"; exit 1; }

          ssh_args=(-p "$SERVER_SSH_PORT" -o BatchMode=yes)
          ssh "${ssh_args[@]}" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$SERVER_DEPLOY_PATH'"
          scp -P "$SERVER_SSH_PORT" docker-compose.yml \
            "$SERVER_USER@$SERVER_HOST:$SERVER_DEPLOY_PATH/docker-compose.yml"

          if [ -n "$GHCR_PULL_TOKEN" ]; then
            test -n "$GHCR_USERNAME" || { echo "GHCR_USERNAME is required when GHCR_PULL_TOKEN is set"; exit 1; }
            printf '%s' "$GHCR_PULL_TOKEN" | ssh "${ssh_args[@]}" "$SERVER_USER@$SERVER_HOST" \
              "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          fi

          ssh "${ssh_args[@]}" "$SERVER_USER@$SERVER_HOST" \
            "cd '$SERVER_DEPLOY_PATH' && docker compose pull && docker compose up -d"
