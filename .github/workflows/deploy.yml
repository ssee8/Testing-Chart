name: Publish container image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and publish image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --tag ghcr.io/ssee8/testing-chart:latest \
            --tag "ghcr.io/ssee8/testing-chart:$GITHUB_SHA" \
            .
          docker push ghcr.io/ssee8/testing-chart:latest
          docker push "ghcr.io/ssee8/testing-chart:$GITHUB_SHA"
